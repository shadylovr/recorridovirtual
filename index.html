<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="estilo.css"/>
  </head>
<body>
    <h1>The Jukebox Time 
      Machine</h1>
    <div>
        <p>Haz click en la rokola y descubre el artista mas escuchado desde los 80 hasta la actualidad . </p>
        
         <a href="80.html">
              <img class="rokola" src="Untitled-1.png"/>
              <script>
                const jukeboxLink = document.querySelector('a[href="80.html"]');
                const jukeboxImage = jukeboxLink.querySelector(".rokola");

                jukeboxLink.addEventListener("click", (event) => {
                  event.preventDefault();
                  jukeboxImage.classList.remove("rebote");
                  void jukeboxImage.offsetWidth;
                  jukeboxImage.classList.add("rebote");
                });

                jukeboxImage.addEventListener("animationend", (event) => {
                  if (event.animationName === "rebote-rokola") {
                    window.location.href = jukeboxLink.href;
                  }
                });
              </script>
